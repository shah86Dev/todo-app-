[project]
name = "todo-app"
version = "0.1.0"
description = "A command-line Todo application with enhanced UI using Typer and Rich"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
todo = "src.todo_app.cli.main:app"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"